<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="honestTai">
  <meta name="description" content="honestTai 的视频动效库：配方卡、动态样片和 Remotion 源码。">
  <title>动效库 | honestTai</title>
  <link rel="icon" href="./logo-mark.svg" type="image/svg+xml">
  <script>
    try {
      const choice = localStorage.getItem('video-shot-gallery-theme') || 'system';
      const theme = choice === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : choice;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeChoice = choice;
      document.documentElement.style.colorScheme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./translations.js" defer></script>
  <script src="./library-offline-data.js" defer></script>
  <script src="./app-offline.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#library" data-i18n="skip">跳到动效列表</a>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="回到顶部" data-i18n-aria-label="brandHome">
      <img src="./logo-mark.svg" alt="" width="28" height="28" aria-hidden="true">
      <span>Motion Library</span>
    </a>
    <div class="topbar-actions">
      <nav class="social" aria-label="作者主页" data-i18n-aria-label="socialLinksLabel">

        </a>
        <a href="https://x.com/Honestn1w" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>

        </a>
      </nav>
      <div class="segmented" id="themeSwitch" role="group" aria-label="页面主题">
        <button type="button" data-theme="system" aria-pressed="true">系统</button>
        <button type="button" data-theme="light" aria-pressed="false">浅色</button>
        <button type="button" data-theme="dark" aria-pressed="false">深色</button>
      </div>
      <div class="segmented" id="languageSwitch" role="group" aria-label="语言">
        <button type="button" data-language="zh" aria-pressed="true">中文</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
      <div id="syncStatus" hidden><span></span><span></span></div>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <p class="hero-author">by honestTai</p>
        <h1 id="pageTitle">动效库</h1>
        <p class="hero-intro" data-i18n="intro"></p>
      </div>
      <dl class="stats" aria-label="动效库统计" data-i18n-aria-label="statsLabel">
        <div><dd id="cardCount">152</dd><dt data-i18n="cards">配方卡</dt></div>
        <div><dd id="styleCount">209</dd><dt data-i18n="styles">动效样式</dt></div>
        <div><dd id="previewCount">209</dd><dt data-i18n="samples">动态样片</dt></div>
      </dl>
    </section>

    <div class="reel" aria-hidden="true">
      <video src="./media/card-flock-tumble.mp4" muted loop autoplay playsinline></video>
      <video src="./media/deck-deal-flyin.mp4" muted loop autoplay playsinline></video>
      <video src="./media/bubble-swarm-takeover.mp4" muted loop autoplay playsinline></video>
      <video src="./media/flying-words.mp4" muted loop autoplay playsinline></video>
      <video src="./media/aurora-bloom-bg-flip.mp4" muted loop autoplay playsinline></video>
    </div>

    <section class="controls" aria-label="筛选动效" data-i18n-aria-label="controlsLabel">
      <div class="controls-row">
        <label class="search-field" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <span class="sr-only" data-i18n="searchLabel">搜索动效</span>
          <input id="searchInput" type="search" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>
      <nav class="category-nav" id="filters" aria-label="按分类筛选" data-i18n-aria-label="filtersLabel">
        <button class="category-link is-active" type="button" data-filter="all"><span data-i18n="all">全部</span></button>
        <button class="category-link" type="button" data-filter="opening"><span data-i18n="catOpening">开场与品牌</span></button>
        <button class="category-link" type="button" data-filter="typography"><span data-i18n="catTypography">文字与字卡</span></button>
        <button class="category-link" type="button" data-filter="ui-entrance"><span data-i18n="catUiEntrance">界面登场</span></button>
        <button class="category-link" type="button" data-filter="camera"><span data-i18n="catCamera">运镜与空间</span></button>
        <button class="category-link" type="button" data-filter="data"><span data-i18n="catData">数据与指标</span></button>
        <button class="category-link" type="button" data-filter="interaction"><span data-i18n="catInteraction">交互演示</span></button>
        <button class="category-link" type="button" data-filter="transition"><span data-i18n="catTransition">转场</span></button>
        <button class="category-link" type="button" data-filter="rhythm"><span data-i18n="catRhythm">节奏与蒙太奇</span></button>
        <button class="category-link" type="button" data-filter="effects"><span data-i18n="catEffects">光效与强调</span></button>
        <button class="category-link" type="button" data-filter="outro"><span data-i18n="catOutro">收尾</span></button>
      </nav>
    </section>

    <section class="library" id="library" aria-live="polite" aria-busy="true"></section>

    <section class="empty-state" id="emptyState" hidden>
      <p data-i18n="empty">没有符合当前条件的动效。</p>
      <button type="button" id="clearFilters" data-i18n="clear">清除筛选</button>
    </section>
  </main>

  <footer class="footer">
    <p>Motion Library · <a href="https://github.com/honestTai" target="_blank" rel="noopener noreferrer">honestTai</a></p>
    <p><span data-i18n="basedOn">基于</span> <a href="https://github.com/Vincentwei1021/video-shotcraft" target="_blank" rel="noopener noreferrer">video-shotcraft</a> · Apache-2.0</p>
  </footer>

  <template id="loadingTemplate">
    <article class="shot-card skeleton-card" aria-hidden="true">
      <div class="skeleton-media"></div>
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line"></div>
    </article>
  </template>

  <div class="selection-bar" id="selectionBar" hidden>
    <span class="selection-count" id="selectionCount"></span>
    <button type="button" class="selection-copy" id="copySelected"></button>
    <button type="button" class="selection-clear" id="clearSelected"></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
